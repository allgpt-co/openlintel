name: Build Python Image and Deploy

on:
  workflow_run:
    workflows:
      - Security Audit
    types:
      - completed
  workflow_dispatch:

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
  COOLIFY_WEBHOOK_URL: ${{ vars.COOLIFY_BACKEND_WEBHOOK || vars.COOLIFY_WEBHOOK_URL }}

jobs:
  build-and-deploy:
    name: Build, push to ECR, and deploy to Coolify
    runs-on: self-hosted
    permissions:
      id-token: write
      contents: read
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main'
      )

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Run Trivy security audit
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,config
          format: table
          severity: HIGH,CRITICAL
          exit-code: '1'
          hide-progress: true
          timeout: 10m
          skip-dirs: .git,venv,.venv,__pycache__,.pytest_cache

      - name: Validate deployment configuration
        shell: bash
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          missing=0

          if [[ -z "$AWS_ROLE_ARN" ]]; then
            echo "::error::Repository variable AWS_ROLE_ARN is required."
            missing=1
          fi

          if [[ -z "$ECR_REPOSITORY" ]]; then
            echo "::error::Repository variable ECR_REPOSITORY is required."
            missing=1
          fi

          if [[ -z "$COOLIFY_WEBHOOK_URL" ]]; then
            echo "::error::Set repository variable COOLIFY_BACKEND_WEBHOOK or COOLIFY_WEBHOOK_URL."
            missing=1
          fi

          if [[ -z "$COOLIFY_API_TOKEN" ]]; then
            echo "::error::Repository secret COOLIFY_API_TOKEN is required."
            missing=1
          fi

          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Resolve image URI
        id: image
        shell: bash
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          repository="${ECR_REPOSITORY#http://}"
          repository="${repository#https://}"
          repository="${repository%/}"

          if [[ "$repository" == *":"* ]]; then
            echo "::error::ECR_REPOSITORY must not include an image tag."
            exit 1
          fi

          if [[ "$repository" == *".amazonaws.com/"* || "$repository" == public.ecr.aws/* ]]; then
            image_uri="$repository"
          else
            image_uri="$ECR_REGISTRY/$repository"
          fi

          echo "image_uri=$image_uri" >> "$GITHUB_OUTPUT"
          echo "Resolved image URI: $image_uri"

      - name: Build and push Docker image
        env:
          IMAGE_URI: ${{ steps.image.outputs.image_uri }}
          IMAGE_TAG: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: |
          docker build --pull \
            -t "$IMAGE_URI:$IMAGE_TAG" \
            -t "$IMAGE_URI:latest" \
            .

          docker push "$IMAGE_URI:$IMAGE_TAG"
          docker push "$IMAGE_URI:latest"

      - name: Trigger Coolify deploy
        env:
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          curl --fail --show-error --silent \
            --retry 3 \
            --retry-delay 5 \
            -X POST \
            -H "Authorization: Bearer $COOLIFY_API_TOKEN" \
            "$COOLIFY_WEBHOOK_URL"

          echo "Coolify deploy webhook triggered."
