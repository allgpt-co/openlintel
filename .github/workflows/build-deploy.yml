name: Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
  COOLIFY_WEBHOOK_URL: ${{ vars.COOLIFY_WEBHOOK_URL || vars.COOLIFY_BACKEND_WEBHOOK }}
  DOCKER_BUILD_CONTEXT: ${{ vars.DOCKER_BUILD_CONTEXT || '.' }}
  DOCKERFILE_PATH: ${{ vars.DOCKERFILE_PATH || 'apps/web/Dockerfile' }}

concurrency:
  group: openlintel-production-deploy
  cancel-in-progress: false

jobs:
  security-audit:
    name: Security audit
    uses: ./.github/workflows/security-audit.yml

  build-and-deploy:
    name: Build image, push to ECR, and deploy to Coolify
    runs-on: self-hosted
    needs: security-audit
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate deployment configuration
        shell: bash
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          missing=0

          if [[ -z "$AWS_ROLE_ARN" ]]; then
            echo "::error::Repository variable AWS_ROLE_ARN is required."
            missing=1
          fi

          if [[ -z "$ECR_REPOSITORY" ]]; then
            echo "::error::Repository variable ECR_REPOSITORY is required."
            missing=1
          fi

          if [[ -z "$COOLIFY_WEBHOOK_URL" ]]; then
            echo "::error::Repository variable COOLIFY_WEBHOOK_URL or COOLIFY_BACKEND_WEBHOOK is required."
            missing=1
          fi

          if [[ -z "$COOLIFY_API_TOKEN" ]]; then
            echo "::error::Repository secret COOLIFY_API_TOKEN is required."
            missing=1
          fi

          if [[ ! -f "$DOCKERFILE_PATH" ]]; then
            echo "::error::Dockerfile not found at $DOCKERFILE_PATH."
            missing=1
          fi

          if [[ ! -d "$DOCKER_BUILD_CONTEXT" ]]; then
            echo "::error::Docker build context not found at $DOCKER_BUILD_CONTEXT."
            missing=1
          fi

          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Resolve image metadata
        id: image
        shell: bash
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          repository="${ECR_REPOSITORY#http://}"
          repository="${repository#https://}"
          repository="${repository%/}"

          if [[ -z "$repository" ]]; then
            echo "::error::ECR_REPOSITORY resolved to an empty value."
            exit 1
          fi

          if [[ "$repository" == *":"* ]]; then
            echo "::error::ECR_REPOSITORY must not include an image tag."
            exit 1
          fi

          if [[ "$repository" == *".amazonaws.com/"* || "$repository" == public.ecr.aws/* ]]; then
            image_uri="$repository"
          else
            image_uri="$ECR_REGISTRY/$repository"
          fi

          short_sha="${GITHUB_SHA::12}"
          echo "image_uri=$image_uri" >> "$GITHUB_OUTPUT"
          echo "sha_tag=sha-$short_sha" >> "$GITHUB_OUTPUT"
          echo "Resolved image URI: $image_uri"
          echo "Resolved immutable tag: sha-$short_sha"

      - name: Build Docker image
        env:
          IMAGE_URI: ${{ steps.image.outputs.image_uri }}
          SHA_TAG: ${{ steps.image.outputs.sha_tag }}
        run: |
          docker build --pull \
            --file "$DOCKERFILE_PATH" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "$IMAGE_URI:$SHA_TAG" \
            --tag "$IMAGE_URI:latest" \
            "$DOCKER_BUILD_CONTEXT"

      - name: Push Docker image to ECR
        env:
          IMAGE_URI: ${{ steps.image.outputs.image_uri }}
          SHA_TAG: ${{ steps.image.outputs.sha_tag }}
        run: |
          docker push "$IMAGE_URI:$SHA_TAG"
          docker push "$IMAGE_URI:latest"

      - name: Trigger Coolify deployment
        env:
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          curl --fail --show-error --silent \
            --retry 3 \
            --retry-delay 5 \
            --request POST \
            --header "Authorization: Bearer $COOLIFY_API_TOKEN" \
            "$COOLIFY_WEBHOOK_URL"

          echo "Coolify deployment webhook triggered."
