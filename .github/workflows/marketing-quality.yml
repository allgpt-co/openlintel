name: Marketing quality

on:
  pull_request:
    paths:
      - 'apps/marketing/**'
      - 'docs/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/marketing-quality.yml'
  push:
    branches: [main]
    paths:
      - 'apps/marketing/**'
      - 'docs/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/marketing-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marketing-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-and-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned workspace dependencies
        run: npx --yes pnpm@9.15.4 install --frozen-lockfile
      - name: Lint marketing source
        run: npx --yes pnpm@9.15.4 marketing:lint
      - name: Unit, artifact and safety checks
        run: npx --yes pnpm@9.15.4 marketing:check
      - name: Build disposable static output
        env:
          MARKETING_OUT_DIR: ${{ runner.temp }}/openlintel-marketing
          # Public reviewed release configuration, never provider API credentials.
          MARKETING_CONTACT_EMAIL: ${{ vars.MARKETING_CONTACT_EMAIL }}
          MARKETING_FORMSPREE_ID: ${{ vars.MARKETING_FORMSPREE_ID }}
          MARKETING_FORMSPREE_VERIFIED: ${{ vars.MARKETING_FORMSPREE_VERIFIED || '0' }}
          MARKETING_OPERATIONS_READY: ${{ vars.MARKETING_OPERATIONS_READY || '0' }}
          MARKETING_PRIVACY_REVIEWED: ${{ vars.MARKETING_PRIVACY_REVIEWED || '0' }}
          MARKETING_PILOT_ENABLED: ${{ vars.MARKETING_PILOT_ENABLED || '0' }}
          MARKETING_GA4_ID: ${{ vars.MARKETING_GA4_ID }}
          MARKETING_GA4_VERIFIED: ${{ vars.MARKETING_GA4_VERIFIED || '0' }}
          MARKETING_ANALYTICS_ENABLED: ${{ vars.MARKETING_ANALYTICS_ENABLED || '0' }}
        run: npx --yes pnpm@9.15.4 marketing:build
      - name: Require checked-in Pages artifacts to match reviewed source and configuration
        env:
          MARKETING_OUT_DIR: ${{ runner.temp }}/openlintel-marketing
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';
          import { join } from 'node:path';
          const built = process.env.MARKETING_OUT_DIR;
          const actual = JSON.parse(await readFile(join(built, 'marketing-manifest.json'), 'utf8'));
          const checked = JSON.parse(await readFile('docs/marketing-manifest.json', 'utf8'));
          assert.deepEqual(checked, actual, 'Rebuild docs/ with the reviewed public release configuration.');
          for (const file of actual.files) {
            assert.deepEqual(await readFile(join('docs', file)), await readFile(join(built, file)), `Stale Pages artifact: ${file}`);
          }
          console.log('Checked-in Pages artifacts match source, configuration, and generated bytes.');
          NODE
      - name: Verify served output without deploying or calling integration providers
        env:
          MARKETING_OUT_DIR: ${{ runner.temp }}/openlintel-marketing
        run: |
          node apps/marketing/preview.mjs > /tmp/openlintel-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://localhost:4173/ > /dev/null; then break; fi
            sleep 1
          done
          node apps/marketing/production-check.mjs \
            --manifest "$MARKETING_OUT_DIR/marketing-manifest.json" \
            --url http://localhost:4173/
      - name: Ensure checks did not mutate tracked state
        run: git diff --exit-code
