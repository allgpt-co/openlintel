name: Security Audit

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'

permissions:
  actions: write
  contents: read

jobs:
  trivy:
    name: Trivy filesystem scan
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine backend deploy scope
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          mkdir -p .audit

          before="${{ github.event.before }}"
          after="${{ github.sha }}"

          if [[ "$before" =~ ^0+$ ]]; then
            git diff-tree --no-commit-id --name-only -r "$after" > .audit/changed-files.txt
          else
            git diff --name-only "$before" "$after" > .audit/changed-files.txt
          fi

          if grep -Eq '^(backend/|\.github/workflows/(backend-worker-deploy|security-audit)\.yml$)' .audit/changed-files.txt; then
            echo "true" > .audit/deploy-needed.txt
          else
            echo "false" > .audit/deploy-needed.txt
          fi

      - name: Run Trivy security audit
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,config
          format: table
          severity: HIGH,CRITICAL
          exit-code: '1'
          hide-progress: true
          timeout: 10m
          skip-dirs: frontend/node_modules,frontend/.next,frontend/out,backend/.pytest_cache,backend/uploads,backend/screenshots,backend/data

      - name: Upload deploy scope
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: deploy-scope
          path: .audit/
          retention-days: 1
          include-hidden-files: true
