name: Security Audit

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read

jobs:
  trivy-filesystem:
    name: Trivy security audit
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run blocking Trivy dependency audit
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          format: table
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          hide-progress: true
          timeout: 15m
          skip-dirs: .git,node_modules,apps/web/.next,apps/web/out,.next,out,dist,coverage,.turbo,venv,.venv,__pycache__,.pytest_cache

      - name: Run advisory Trivy security report
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,config
          format: table
          severity: HIGH,CRITICAL
          exit-code: '0'
          ignore-unfixed: true
          hide-progress: true
          timeout: 15m
          skip-dirs: .git,node_modules,apps/web/.next,apps/web/out,.next,out,dist,coverage,.turbo,venv,.venv,__pycache__,.pytest_cache
