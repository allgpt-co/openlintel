# Production only. See infra/COOLIFY.md for setup and release gates.
services:
  redis:
    restart: unless-stopped
    init: true
    mem_limit: 512m
    cpus: '1.0'
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    image: redis:7-alpine
    command:
    - redis-server
    - --appendonly
    - 'yes'
    - --maxmemory
    - 384mb
    - --maxmemory-policy
    - noeviction
    volumes:
    - redis_data:/data
    networks:
      default:
        aliases:
        - openlintel-redis
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 60s
  meilisearch:
    restart: unless-stopped
    init: true
    mem_limit: 1g
    cpus: '1.0'
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    image: getmeili/meilisearch:v1.12
    environment:
      MEILI_ENV: production
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?Set MEILI_MASTER_KEY in Coolify}
    volumes:
    - meilisearch_data:/meili_data
    networks:
      default:
        aliases:
        - openlintel-meilisearch
    healthcheck:
      test:
      - CMD
      - curl
      - -fsS
      - http://127.0.0.1:7700/health
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 60s
  migrate:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        BUILD_SHA: ${BUILD_SHA:?Set BUILD_SHA in Coolify}
        NEXT_PUBLIC_COLLAB_SERVICE_URL: ${NEXT_PUBLIC_COLLAB_SERVICE_URL:?Set NEXT_PUBLIC_COLLAB_SERVICE_URL in
          Coolify}
      target: migrate
    restart: 'no'
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in Coolify}
    networks:
    - default
    - database
    mem_limit: 1g
  design-engine:
    restart: unless-stopped
    init: true
    mem_limit: 2g
    cpus: '1.0'
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    build:
      context: .
      dockerfile: services/design-engine/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in Coolify}
      REDIS_URL: redis://openlintel-redis:6379
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in Coolify}
      API_KEY_ENCRYPTION_SECRET: ${API_KEY_ENCRYPTION_SECRET:?Set API_KEY_ENCRYPTION_SECRET in Coolify}
      AWS_REGION: ${AWS_REGION:?Set AWS_REGION in Coolify}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:?Set AWS_S3_BUCKET in Coolify}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      ENVIRONMENT: production
      CORS_ORIGINS: '["${AUTH_URL:?Set AUTH_URL}"]'
      SERVICE_NAME: design-engine
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
    - default
    - database
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/health/ready", timeout=5).read()
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 60s
