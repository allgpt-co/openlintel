<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc"><title id="title">A decision record connecting the unresolved F-01 sofa model to dimensions, budget, timeline, and review ownership</title><desc id="desc">Illustrative teaching diagram, not a site record or construction instruction.</desc><rect width="1000" height="620" fill="#f5f1e9"/><style>text{font-family:Arial,sans-serif;font-size:20px;fill:#252722}.heading{font-size:25px}.tag{font-size:14px;letter-spacing:1px;fill:#914f38}.note{font-size:18px}</style><text x="60" y="65" class="tag">OPENLINTEL / DECISIONS</text><g transform="translate(60 135)"><rect width="410" height="160" fill="#ece7dd"/><text x="24" y="36" class="tag">DECISION</text><text x="24" y="78" class="heading">F-01 final sofa model</text><text x="24" y="118" class="note">Unresolved in the sample</text></g><g transform="translate(530 135)"><rect width="410" height="160" fill="#ece7dd"/><text x="24" y="36" class="tag">INPUT</text><text x="24" y="78" class="heading">Dimensions + supplier</text><text x="24" y="118" class="note">No verified product selected</text></g><g transform="translate(60 325)"><rect width="410" height="160" fill="#ece7dd"/><text x="24" y="36" class="tag">IMPACT</text><text x="24" y="78" class="heading">Plan, budget, timeline</text><text x="24" y="118" class="note">Review affected records together</text></g><g transform="translate(530 325)"><rect width="410" height="160" fill="#ece7dd"/><text x="24" y="36" class="tag">OWNER / REVIEW</text><text x="24" y="78" class="heading">To appoint</text><text x="24" y="118" class="note">Do not invent approval or dates</text></g><path d="M60 565H940" stroke="#d8d1c5"/><text x="60" y="595" class="tag">ILLUSTRATIVE TEACHING DIAGRAM · PENDING REVIEW · NOT FOR CONSTRUCTION</text></svg>