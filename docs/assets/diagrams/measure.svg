<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc"><title id="title">Nominal 5000 by 4000 mm room outline with diagonal-check reminders and a 20 m² floor-footprint calculation</title><desc id="desc">Illustrative teaching diagram, not a site record or construction instruction.</desc><rect width="1000" height="620" fill="#f5f1e9"/><style>text{font-family:Arial,sans-serif;font-size:20px;fill:#252722}.heading{font-size:25px}.tag{font-size:14px;letter-spacing:1px;fill:#914f38}.note{font-size:18px}</style><text x="60" y="65" class="tag">OPENLINTEL / MEASURE</text><rect x="90" y="150" width="440" height="352" fill="none" stroke="#252722" stroke-width="4"/><path d="M90 150L530 502M530 150L90 502" stroke="#914f38" stroke-dasharray="9 7" fill="none"/><text x="240" y="130">5000 mm nominal</text><text x="100" y="535">4000 mm nominal depth</text><text x="595" y="190" class="heading">Check, don’t assume</text><text x="595" y="235">Diagonals not surveyed.</text><text x="595" y="270">Confirm every opening.</text><text x="595" y="305">Record source and units.</text><text x="595" y="385" class="heading">5 m × 4 m = 20 m²</text><text x="595" y="425">Floor footprint only.</text><text x="595" y="460">Not a wall-area takeoff.</text><path d="M60 565H940" stroke="#d8d1c5"/><text x="60" y="595" class="tag">ILLUSTRATIVE TEACHING DIAGRAM · PENDING REVIEW · NOT FOR CONSTRUCTION</text></svg>