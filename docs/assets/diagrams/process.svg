<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc"><title id="title">Design workflow: discovery, concept, development, and handoff, each with a review decision</title><desc id="desc">Illustrative teaching diagram, not a site record or construction instruction.</desc><rect width="1000" height="620" fill="#f5f1e9"/><style>text{font-family:Arial,sans-serif;font-size:20px;fill:#252722}.heading{font-size:25px}.tag{font-size:14px;letter-spacing:1px;fill:#914f38}.note{font-size:18px}</style><text x="60" y="65" class="tag">OPENLINTEL / PROCESS</text><g transform="translate(60 135)"><rect width="410" height="160" fill="#ece7dd"/><text x="24" y="36" class="tag">01 / DISCOVERY</text><text x="24" y="78" class="heading">Agreed brief</text><text x="24" y="118" class="note">Needs, constraints, open questions</text></g><g transform="translate(530 135)"><rect width="410" height="160" fill="#ece7dd"/><text x="24" y="36" class="tag">02 / CONCEPT</text><text x="24" y="78" class="heading">Selected direction</text><text x="24" y="118" class="note">Review the idea before the details</text></g><g transform="translate(60 325)"><rect width="410" height="160" fill="#ece7dd"/><text x="24" y="36" class="tag">03 / DEVELOPMENT</text><text x="24" y="78" class="heading">Coordinated information</text><text x="24" y="118" class="note">Connect drawings and schedules</text></g><g transform="translate(530 325)"><rect width="410" height="160" fill="#ece7dd"/><text x="24" y="36" class="tag">04 / HANDOFF</text><text x="24" y="78" class="heading">Current issue + actions</text><text x="24" y="118" class="note">Name recipients and intended use</text></g><path d="M60 565H940" stroke="#d8d1c5"/><text x="60" y="595" class="tag">ILLUSTRATIVE TEACHING DIAGRAM · PENDING REVIEW · NOT FOR CONSTRUCTION</text></svg>