<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc"><title id="title">Procurement states: proposed selection, supplier confirmation, authorized order, and receipt; the sample is not ordered</title><desc id="desc">Illustrative teaching diagram, not a site record or construction instruction.</desc><rect width="1000" height="620" fill="#f5f1e9"/><style>text{font-family:Arial,sans-serif;font-size:20px;fill:#252722}.heading{font-size:25px}.tag{font-size:14px;letter-spacing:1px;fill:#914f38}.note{font-size:18px}</style><text x="60" y="65" class="tag">OPENLINTEL / PROCUREMENT</text><g transform="translate(60 135)"><rect width="410" height="160" fill="#ece7dd"/><text x="24" y="36" class="tag">01 / SELECTION</text><text x="24" y="78" class="heading">Proposed item</text><text x="24" y="118" class="note">Identity and dimensions to review</text></g><g transform="translate(530 135)"><rect width="410" height="160" fill="#ece7dd"/><text x="24" y="36" class="tag">02 / SUPPLIER</text><text x="24" y="78" class="heading">Current information</text><text x="24" y="118" class="note">Confirm source, quote, availability</text></g><g transform="translate(60 325)"><rect width="410" height="160" fill="#ece7dd"/><text x="24" y="36" class="tag">03 / ORDER</text><text x="24" y="78" class="heading">Agreed responsibility</text><text x="24" y="118" class="note">Not represented in the sample</text></g><g transform="translate(530 325)"><rect width="410" height="160" fill="#ece7dd"/><text x="24" y="36" class="tag">04 / RECEIPT</text><text x="24" y="78" class="heading">Record the delivery</text><text x="24" y="118" class="note">Not represented in the sample</text></g><path d="M60 565H940" stroke="#d8d1c5"/><text x="60" y="595" class="tag">ILLUSTRATIVE TEACHING DIAGRAM · PENDING REVIEW · NOT FOR CONSTRUCTION</text></svg>