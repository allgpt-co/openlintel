<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc"><title id="title">Notional reflected ceiling plan showing a room outline, an illustrative lighting symbol, an unresolved coordination zone, and an unverified 2800 mm ceiling height</title><desc id="desc">Illustrative teaching diagram, not a site record or construction instruction.</desc><rect width="1000" height="620" fill="#f5f1e9"/><style>text{font-family:Arial,sans-serif;font-size:20px;fill:#252722}.heading{font-size:25px}.tag{font-size:14px;letter-spacing:1px;fill:#914f38}.note{font-size:18px}</style><text x="60" y="65" class="tag">OPENLINTEL / RCP</text><rect x="90" y="150" width="440" height="352" fill="none" stroke="#252722" stroke-width="4"/><circle cx="310" cy="310" r="22" fill="none" stroke="#914f38" stroke-width="3"/><path d="M288 310H332M310 288V332" stroke="#914f38" stroke-width="2"/><rect x="385" y="190" width="90" height="110" fill="none" stroke="#914f38" stroke-dasharray="8 6"/><text x="110" y="465">Ceiling: 2800 mm nominal</text><text x="580" y="190" class="heading">Read the legend</text><text x="580" y="235">Circle: notional lighting only.</text><text x="580" y="275">Dashed zone: interface to review.</text><text x="580" y="350">No fixture or location specified.</text><text x="580" y="390">No services design represented.</text><text x="580" y="430">New teaching diagram, not WR-03.</text><path d="M60 565H940" stroke="#d8d1c5"/><text x="60" y="595" class="tag">ILLUSTRATIVE TEACHING DIAGRAM · PENDING REVIEW · NOT FOR CONSTRUCTION</text></svg>